<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu site</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav>
        <a href="#">Início</a>
        <a href="#">Sobre</a>
        <a href="#">Contato</a>
    </nav>

    <section class="sobre">
        <h2>Sobre Mim</h2>
        <p>Sou aluno do curso técnico de Desenvolvimento de Sistemas.</p>
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRItl84rkdi8mD0f2SktE9HxnBImXDLQkTp5rRsqylDgQ&s=10"
            alt="Foto de perfil" class="foto-perfil">
    </section>

    <section class="projetos">
        <h2>Meus Projetos</h2>
        <div class="grid-projetos">
            <div class="card">
                <h3>Projeto 1</h3>
                <p>Landing page para um negócio local.</p>
            </div>
            <div class="card">
                <h3>Projeto 2</h3>
                <p>Clone de um card de produto.</p>
            </div>
            <div class="card">
                <h3>Projeto 3</h3>
                <p>Portfólio pessoal responsivo.</p>
            </div>
        </div>
    </section>

    <section class="contato">
        <h2>Contato</h2>
        <form>
            <label for="nome">Nome:</label>
            <input type="text" id="nome">

            <label for="email">Email:</label>
            <input type="email" id="email">

            <button type="submit">Enviar</button>
        </form>
    </section>

    <footer>
        <p>&copy; 2026 Meu Site. Todos os direitos reservados.</p>
    </footer>
</body>

</html>
